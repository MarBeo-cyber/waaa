[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waaa"
version = "1.0.0"
description = "WAAA — Weak Autopoietic Artificial Agent: ML system for environmental anomaly detection and autopoietic recovery"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "WAAA Contributors" }
]
keywords = ["autopoiesis", "anomaly-detection", "reinforcement-learning", "embodied-ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
  "flask>=2.3.0",
  "numpy>=1.24.0",
  "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.1.0",
]

[project.scripts]
waaa = "main_ml:main"

[project.urls]
Homepage = "https://github.com/MarBeo-cyber/waaa"
Repository = "https://github.com/MarBeo-cyber/waaa"
Issues = "https://github.com/MarBeo-cyber/waaa/issues"

[tool.setuptools]
packages = ["api", "core", "federation", "ml", "sensors", "waaa_memory"]
py-modules = ["main_ml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# "I" (import sorting) and "UP" (pyupgrade) are deliberately not enabled:
# turning them on rewrites the import block and every Optional[...] in
# every file at once. They are worth doing, but as their own commit.
select = ["E", "F", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
