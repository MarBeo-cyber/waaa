[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "waaa"
version = "1.0.0"
description = "WAAA — Weak Autopoietic Artificial Agent: federated ML system for environmental anomaly detection and autopoietic recovery"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "WAAA Contributors" }
]
keywords = ["autopoiesis", "anomaly-detection", "federated-ai", "reinforcement-learning", "embodied-ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
  "flask>=2.3.0",
  "numpy>=1.24.0",
  "scikit-learn>=1.3.0",
  "opencv-python-headless>=4.7.0",
  "Pillow>=9.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.1.0",
  "mypy>=1.5",
]
webcam = [
  "opencv-python>=4.7.0",
]

[project.scripts]
waaa = "main_ml:cli_entry"

[project.urls]
Homepage = "https://github.com/YOUR_ORG/waaa"
Documentation = "https://github.com/YOUR_ORG/waaa/wiki"
Repository = "https://github.com/YOUR_ORG/waaa"
Issues = "https://github.com/YOUR_ORG/waaa/issues"
Changelog = "https://github.com/YOUR_ORG/waaa/blob/main/CHANGELOG.md"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing --cov-report=xml"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
